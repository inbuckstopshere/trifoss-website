<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Archive — Trifoss</title>
<meta name="description" content="Every approved article ever published, in one place. Unlike Events, articles never expire or get removed by date — this page exists for volume, not lifecycle.">
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav-inner">
    <a class="brand" href="../index.html">
      <img src="../assets/images/logo.svg" alt="Trifoss emblem">
      <span>Trifoss</span>
    </a>
    <nav class="primary-nav" aria-label="Primary">
      <a href="../index.html">Home</a>
      <a href="../index.html#news">Latest news &amp; stories</a>
    </nav>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow">News &amp; Blogs</span>
        <h1>News Archive</h1>
        <p>Every approved article ever published, in one place. Unlike Events, articles never expire or get removed by date — this page exists for volume, not lifecycle.</p>
      </div>

      <div class="card-grid">
        <p style="grid-column: 1 / -1; text-align: center; color: var(--ink-soft);">No articles published yet.</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom">
    &copy; <span id="year"></span> Trifoss. All rights reserved.
  </div>
</footer>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
