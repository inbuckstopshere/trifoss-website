name: Build and publish site

# Reads approved rows from the Events/News Stage 2 Sheets via a small Apps
# Script Web App (BUILD_ENDPOINT_URL, gated by BUILD_ENDPOINT_KEY — both
# GitHub repo secrets, see README.md for how to set them up), generates a
# static page per new approved item, saves its image, and updates the
# homepage/archive listings. Commits whatever changed so GitHub Pages
# republishes it.
#
# Currently manual-trigger only, on purpose — leave it that way until
# you've run it once via the "Run workflow" button and checked the result.
# Uncomment the schedule below once you're confident in it.

on:
  workflow_dispatch: {}      # manual "Run workflow" button in the GitHub Actions tab
  # schedule:
  #   - cron: '0 * * * *'    # uncomment for hourly runs once you trust a manual run

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build script
        env:
          BUILD_ENDPOINT_URL: ${{ secrets.BUILD_ENDPOINT_URL }}
          BUILD_ENDPOINT_KEY: ${{ secrets.BUILD_ENDPOINT_KEY }}
        run: node scripts/build.js

      - name: Commit generated pages (if any changes)
        run: |
          git config user.name "trifoss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events news assets/images index.html
          git diff --cached --quiet || git commit -m "Publish approved content"
          git push
